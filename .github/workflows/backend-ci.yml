# ============================================================================
# NORDI REMITTANCE — BACKEND CI/CD PIPELINE
# Advanced GitHub Actions workflow for fintech-grade backend
# ============================================================================

name: "🔧 Backend CI/CD"

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths:
      - "Backend-Nordi-remittance/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Backend-Nordi-remittance/**"

defaults:
  run:
    working-directory: Backend-Nordi-remittance

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nordi-api

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ============================================================================
jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 1: LINT & TYPE CHECK
  # ══════════════════════════════════════════════════════════════════════════
  lint:
    name: "🔍 Lint & Type Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Backend-Nordi-remittance/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 2: UNIT & INTEGRATION TESTS
  # ══════════════════════════════════════════════════════════════════════════
  test:
    name: "🧪 Tests (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: Backend-Nordi-remittance/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/remit_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-key-for-ci-testing-12345678901234567890
          JWT_REFRESH_SECRET: test-refresh-secret-key-12345678901234567890
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          JWT_ISSUER: remit-test
          ENCRYPTION_KEY: 32-char-test-encryption-key-here

      - name: Upload coverage report
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: Backend-Nordi-remittance/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 3: SECURITY SCAN
  # ══════════════════════════════════════════════════════════════════════════
  security:
    name: "🛡️ Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Backend-Nordi-remittance/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Check for known vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=Backend-Nordi-remittance/package.json

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 4: BUILD & PUSH DOCKER IMAGE
  # ══════════════════════════════════════════════════════════════════════════
  build:
    name: "🐳 Build & Push Docker"
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "version=$(cat package.json | jq -r '.version')" >> $GITHUB_OUTPUT
          else
            echo "version=$(cat package.json | jq -r '.version')-dev.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ./Backend-Nordi-remittance
          file: ./Backend-Nordi-remittance/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 5: CONTAINER SECURITY SCAN
  # ══════════════════════════════════════════════════════════════════════════
  container-scan:
    name: "🔐 Container Security"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 6: DEPLOY STAGING
  # ══════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: "🚀 Deploy Staging"
    runs-on: ubuntu-latest
    needs: [build, container-scan]
    if: github.ref == 'refs/heads/develop'
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}"
          echo "Version: ${{ needs.build.outputs.version }}"
          # Add your deployment command here:
          # kubectl set image deployment/nordi-api nordi-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }} -n staging

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 7: DEPLOY PRODUCTION
  # ══════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: "🏭 Deploy Production"
    runs-on: ubuntu-latest
    needs: [build, container-scan]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "🏭 Deploying to production..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}"
          echo "Version: ${{ needs.build.outputs.version }}"
          # Add your deployment command here:
          # kubectl set image deployment/nordi-api nordi-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }} -n production

      - name: Verify deployment
        run: |
          echo "Verifying deployment health..."
          # curl -f ${{ vars.PRODUCTION_URL }}/health || exit 1

  # ══════════════════════════════════════════════════════════════════════════
  # NOTIFICATION
  # ══════════════════════════════════════════════════════════════════════════
  notify:
    name: "📢 Notify"
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always() && github.event_name == 'push'
    timeout-minutes: 5

    steps:
      - name: Pipeline status
        run: |
          if [ "${{ needs.test.result }}" == "failure" ] || [ "${{ needs.build.result }}" == "failure" ]; then
            echo "❌ Backend CI/CD pipeline FAILED"
            exit 1
          else
            echo "✅ Backend CI/CD pipeline PASSED"
          fi

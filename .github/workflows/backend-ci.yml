name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'Backend-remittance/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Backend-remittance/**'

defaults:
  run:
    working-directory: Backend-remittance

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: Backend-remittance/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run type checking
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/remit-test
          JWT_SECRET: test-jwt-secret-key-for-ci-testing-12345678901234567890
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          JWT_ISSUER: remit-test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Run test coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/remit-test
          JWT_SECRET: test-jwt-secret-key-for-ci-testing-12345678901234567890
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: Backend-remittance/coverage/coverage-final.json
          flags: backend
          name: backend-coverage
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: Backend-remittance/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: Backend-remittance/dist

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t remit-api:${{ github.sha }} .

      - name: Save Docker image info
        run: docker images remit-api:${{ github.sha }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: Backend-remittance/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          if [ "${{ needs.test.result }}" == "failure" ] || [ "${{ needs.build.result }}" == "failure" ]; then
            echo "CI/CD pipeline failed!"
            exit 1
          else
            echo "CI/CD pipeline succeeded!"
          fi

# ============================================================================
# NORDI REMITTANCE — SECURITY SCANNING PIPELINE
# Scheduled security scans for fintech compliance
# ============================================================================

name: "🛡️ Security Scan"

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # DEPENDENCY AUDIT
  # ══════════════════════════════════════════════════════════════════════════
  dependency-audit:
    name: "📦 Dependency Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        project:
          - { name: "Backend", path: "Backend-Nordi-remittance" }
          - { name: "Frontend", path: "Frontend-Nordi-Remittance" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ matrix.project.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project.path }}
        run: npm ci

      - name: Run npm audit
        working-directory: ${{ matrix.project.path }}
        run: |
          echo "🔍 Auditing ${{ matrix.project.name }} dependencies..."
          npm audit --audit-level=moderate || true
          echo ""
          echo "📊 Outdated packages:"
          npm outdated || true

  # ══════════════════════════════════════════════════════════════════════════
  # SECRET SCANNING
  # ══════════════════════════════════════════════════════════════════════════
  secret-scan:
    name: "🔐 Secret Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ══════════════════════════════════════════════════════════════════════════
  # LICENSE COMPLIANCE
  # ══════════════════════════════════════════════════════════════════════════
  license-check:
    name: "📜 License Compliance"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        project:
          - { name: "Backend", path: "Backend-Nordi-remittance" }
          - { name: "Frontend", path: "Frontend-Nordi-Remittance" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ matrix.project.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project.path }}
        run: npm ci

      - name: Check licenses
        working-directory: ${{ matrix.project.path }}
        run: |
          npx license-checker --production --onlyAllow "MIT;BSD-2-Clause;BSD-3-Clause;ISC;Apache-2.0;0BSD;Unlicense;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Python-2.0;BlueOak-1.0.0" --summary || true

  # ══════════════════════════════════════════════════════════════════════════
  # NOTIFICATION
  # ══════════════════════════════════════════════════════════════════════════
  notify:
    name: "📢 Security Report"
    runs-on: ubuntu-latest
    needs: [dependency-audit, secret-scan, license-check]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Security scan summary
        run: |
          echo "🛡️ Weekly security scan completed"
          echo "Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "Secret Detection: ${{ needs.secret-scan.result }}"
          echo "License Compliance: ${{ needs.license-check.result }}"

# ============================================================================
# NORDI REMITTANCE — FRONTEND CI/CD PIPELINE
# Advanced GitHub Actions workflow for fintech-grade frontend
# ============================================================================

name: "🎨 Frontend CI/CD"

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths:
      - "Frontend-Nordi-Remittance/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Frontend-Nordi-Remittance/**"

defaults:
  run:
    working-directory: Frontend-Nordi-Remittance

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nordi-frontend

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ============================================================================
jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 1: LINT & TYPE CHECK
  # ══════════════════════════════════════════════════════════════════════════
  lint:
    name: "🔍 Lint & Type Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Frontend-Nordi-Remittance/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check
        continue-on-error: true

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 2: TEST
  # ══════════════════════════════════════════════════════════════════════════
  test:
    name: "🧪 Tests"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Frontend-Nordi-Remittance/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: Frontend-Nordi-Remittance/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 3: BUILD
  # ══════════════════════════════════════════════════════════════════════════
  build:
    name: "📦 Build"
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Frontend-Nordi-Remittance/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

      - name: Check bundle size
        run: |
          echo "📊 Bundle size report:"
          du -sh dist/
          echo ""
          echo "Asset breakdown:"
          find dist/assets -type f | while read f; do
            size=$(du -sh "$f" | cut -f1)
            echo "  $size  $(basename $f)"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend-Nordi-Remittance/dist
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 4: LIGHTHOUSE AUDIT
  # ══════════════════════════════════════════════════════════════════════════
  lighthouse:
    name: "🔦 Lighthouse Audit"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Frontend-Nordi-Remittance/dist

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          uploadArtifacts: true
          configPath: Frontend-Nordi-Remittance/.lighthouserc.json

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 5: DEPLOY TO VERCEL
  # ══════════════════════════════════════════════════════════════════════════
  deploy-preview:
    name: "🔗 Deploy Preview"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Preview)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: Frontend-Nordi-Remittance

  deploy-production:
    name: "🚀 Deploy Production"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Production)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: Frontend-Nordi-Remittance

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 6: DOCKER BUILD (for container-based deployments)
  # ══════════════════════════════════════════════════════════════════════════
  docker:
    name: "🐳 Docker Build"
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend-Nordi-Remittance
          file: ./Frontend-Nordi-Remittance/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_APP_ENV=${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

  # ══════════════════════════════════════════════════════════════════════════
  # NOTIFICATION
  # ══════════════════════════════════════════════════════════════════════════
  notify:
    name: "📢 Notify"
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always() && github.event_name == 'push'
    timeout-minutes: 5

    steps:
      - name: Pipeline status
        run: |
          if [ "${{ needs.build.result }}" == "failure" ]; then
            echo "❌ Frontend CI/CD pipeline FAILED"
            exit 1
          else
            echo "✅ Frontend CI/CD pipeline PASSED"
          fi

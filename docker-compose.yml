# ============================================================================
# NORDI REMITTANCE — FULL-STACK DOCKER COMPOSE (Development)
# Run: docker compose up --build
# Services: Frontend, API, ML, MongoDB, Redis, Kafka (KRaft), Kafka UI
# ============================================================================

version: "3.9"

services:
  # ── Frontend (Vite Dev Server) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend-Nordi-Remittance
      dockerfile: Dockerfile
      target: deps
    container_name: nordi-frontend
    command: npx vite --host 0.0.0.0
    volumes:
      - ./Frontend-Nordi-Remittance:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api/v1
      - VITE_APP_ENV=development
    depends_on:
      - api
    networks:
      - nordi-network

  # ── Backend API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./Backend-Nordi-remittance
      dockerfile: Dockerfile.dev
    container_name: nordi-api
    restart: unless-stopped
    volumes:
      - ./Backend-Nordi-remittance:/app
      - /app/node_modules
    ports:
      - "${PORT:-3000}:3000"
      - "9229:9229"    # Debug port
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/remit
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - BULLMQ_REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CLIENT_ID=nordi-remit-api
      - KAFKA_GROUP_ID=nordi-remit-group
      - KAFKA_SSL=false
      - ML_SERVICE_URL=http://ml:8000
    env_file:
      - ./Backend-Nordi-remittance/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - nordi-network

  # ── Machine Learning Service ───────────────────────────────────────────────
  ml:
    build:
      context: ./Nordi-Machine-Learning
      dockerfile: Dockerfile.dev
    container_name: nordi-ml
    restart: unless-stopped
    volumes:
      - ./Nordi-Machine-Learning:/app
    ports:
      - "8000:8000"
    environment:
      - ML_SERVICE_HOST=0.0.0.0
      - ML_SERVICE_PORT=8000
      - MONGODB_URI=mongodb://mongo:27017/remit
      - REDIS_URL=redis://redis:6379
      - BACKEND_API_URL=http://api:3000/api/v1
      - LOG_LEVEL=INFO
    env_file:
      - ./Nordi-Machine-Learning/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nordi-network

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: nordi-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - nordi-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nordi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - nordi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka (KRaft mode — no Zookeeper) ─────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: nordi-kafka
    restart: unless-stopped
    ports:
      - "29092:9092"
      - "9093:9093"    # Controller port
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Topic defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "nordi-kafka-cluster-dev-001"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - nordi-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka UI ───────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nordi-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: nordi-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
      DYNAMIC_CONFIG_ENABLED: "true"
      LOGGING_LEVEL_ROOT: WARN
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - nordi-network

  # ── Mongo Express (DB GUI) ─────────────────────────────────────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: nordi-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - nordi-network

networks:
  nordi-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
  kafka-data:
    driver: local

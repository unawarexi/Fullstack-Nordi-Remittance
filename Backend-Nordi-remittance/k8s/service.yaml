# ============================================================================
# REMIT API - KUBERNETES SERVICE
# ClusterIP service for internal communication
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: remit-api
  namespace: remit
  labels:
    app: remit-api
spec:
  type: ClusterIP
  selector:
    app: remit-api
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP

---
# ============================================================================
# REMIT API - KUBERNETES INGRESS
# Nginx Ingress with TLS
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remit-api-ingress
  namespace: remit
  labels:
    app: remit-api
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.remit.com
      secretName: remit-api-tls
  rules:
    - host: api.remit.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: remit-api
                port:
                  number: 80

---
# ============================================================================
# REMIT API - HORIZONTAL POD AUTOSCALER
# Auto-scale based on CPU/Memory usage
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: remit-api-hpa
  namespace: remit
  labels:
    app: remit-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: remit-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

---
# ============================================================================
# REMIT API - POD DISRUPTION BUDGET
# Ensure minimum availability during disruptions
# ============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: remit-api-pdb
  namespace: remit
  labels:
    app: remit-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: remit-api

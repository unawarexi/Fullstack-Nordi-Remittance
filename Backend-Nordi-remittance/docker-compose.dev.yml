# ============================================================================
# REMIT REMITTANCE - DOCKER COMPOSE DEVELOPMENT
# Development environment with hot reload and debugging
# ============================================================================

version: '3.9'

services:
  # ==========================================================================
  # REMIT BACKEND API (Development with hot reload)
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: remit-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9229:9229"  # Debugger port
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/remit_dev
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - JWT_REFRESH_SECRET=dev-refresh-secret-change-in-production
      - ENCRYPTION_KEY=32-char-dev-encryption-key-here
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis
    networks:
      - remit-dev-network
    command: npm run dev

  # ==========================================================================
  # MONGODB DATABASE (Development)
  # ==========================================================================
  mongo:
    image: mongo:7.0
    container_name: remit-mongo-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev-data:/data/db
    networks:
      - remit-dev-network

  # ==========================================================================
  # REDIS CACHE (Development)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: remit-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - remit-dev-network

  # ==========================================================================
  # MONGO EXPRESS (Database GUI)
  # ==========================================================================
  mongo-express:
    image: mongo-express
    container_name: remit-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      - mongo
    networks:
      - remit-dev-network

  # ==========================================================================
  # REDIS COMMANDER (Redis GUI)
  # ==========================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: remit-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - remit-dev-network

# ==========================================================================
# NETWORKS
# ==========================================================================
networks:
  remit-dev-network:
    driver: bridge

# ==========================================================================
# VOLUMES
# ==========================================================================
volumes:
  mongo-dev-data:
    driver: local
  redis-dev-data:
    driver: local

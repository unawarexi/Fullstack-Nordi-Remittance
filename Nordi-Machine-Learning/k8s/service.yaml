# ============================================================================
# NORDI ML SERVICE — KUBERNETES SERVICE + HPA
# ClusterIP for internal API calls + HPA for auto-scaling
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: nordi-ml
  namespace: nordi
  labels:
    app: nordi-ml
spec:
  type: ClusterIP
  selector:
    app: nordi-ml
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

---
# ============================================================================
# NORDI ML — HORIZONTAL POD AUTOSCALER
# ML inference is CPU/memory intensive — scale aggressively
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nordi-ml-hpa
  namespace: nordi
  labels:
    app: nordi-ml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nordi-ml
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60    # Scale earlier — ML is compute heavy
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max

---
# ============================================================================
# NORDI ML — POD DISRUPTION BUDGET
# ============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nordi-ml-pdb
  namespace: nordi
  labels:
    app: nordi-ml
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nordi-ml

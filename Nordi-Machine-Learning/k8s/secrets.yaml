  # Example: mongodb+srv://user:pass@cluster.mongodb.net/remit
  MONGODB_URI: bW9uZ29kYjovL2xvY2FsaG9zdDoyNzAxNy9yZW1pdA==

  # Redis URL (base64 encoded)
  # Example: redis://:password@redis:6379

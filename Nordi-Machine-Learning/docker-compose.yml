# ============================================================================
# NORDI ML SERVICE — STANDALONE DOCKER COMPOSE
# For ML service development without the full monorepo stack
# Run: docker compose up -d
# ============================================================================

version: '3.9'

services:
  # ==========================================================================
  # NORDI ML API
  # ==========================================================================
  ml:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nordi-ml-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ML_SERVICE_HOST=0.0.0.0
      - ML_SERVICE_PORT=8000
      - MONGODB_URI=mongodb://mongo:27017/remit
      - REDIS_URL=redis://redis:6379
      - BACKEND_API_URL=http://host.docker.internal:3000/api/v1
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/venv
      - ml-models:/app/models/saved
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ml-network

  # ==========================================================================
  # MONGODB (shared with backend when running full stack)
  # ==========================================================================
  mongo:
    image: mongo:7.0
    container_name: nordi-ml-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================================================
  # REDIS
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: nordi-ml-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ml-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
  ml-models:
    driver: local
